name: 更新資料

on:
  schedule:
    # BLS 美東 8:30 發布，FRED 約 30 分鐘內上架；工作日抓兩次（UTC 13:15、15:15）
    - cron: "15 13,15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - run: python pipeline/labor.py
      - name: 有變動才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet -- data/; then
            echo "資料無變動"
          else
            git commit -m "資料更新 $(date -u +%Y-%m-%d)"
            git push
          fi
