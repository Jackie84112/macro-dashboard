name: 更新資料

on:
  schedule:
    # 台灣時間每天 08:00（UTC 00:00）
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

# 兩個排程共用同一群組，排隊執行，避免同時推送撞車
concurrency:
  group: repo-push
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - run: python pipeline/labor.py
      - run: python pipeline/rates.py
      - run: python pipeline/margin_tw.py
        continue-on-error: true   # 台股來源失敗不擋其他頁更新
      - name: 有變動才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet -- data/; then
            echo "資料無變動"
          else
            git commit -m "資料更新 $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
