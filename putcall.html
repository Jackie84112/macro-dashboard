<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Put/Call 比率｜宏觀監控儀表板</title>
<style>
  /* 版面、按鈕、浮標沿用股債信用疊圖（overlay.html） */
  :root{
    --bg:#F6F5F2; --card:#FFFFFF; --ink:#22262B; --muted:#6B7178;
    --line:#E4E2DC; --accent:#B04A2F;
    --pc:#2563EB; --lo5:#D97706; --hi5:#DC2626; --idx:#22262B; --band:rgba(217,79,61,0.10); --band-cur:rgba(217,79,61,0.20);
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);
    font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
    margin:0;padding:0 16px 40px;}
  .wrap{max-width:1180px;margin:20px auto 0;display:flex;flex-direction:column;gap:14px;}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;padding:4px 4px 0;}
  h1{font-size:28px;margin:0;letter-spacing:.5px;}
  .sub{color:var(--muted);font-size:13px;margin:0;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
  .controls{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;}
  .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .grp .lbl{font-size:12px;color:var(--muted);letter-spacing:1px;margin-right:2px;}
  button.rng{border:1px solid var(--line);background:transparent;color:var(--muted);
    border-radius:7px;padding:5px 11px;font-size:13px;cursor:pointer;font-family:inherit;}
  button.rng:hover{border-color:#C9C6BF;}
  button.rng.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  button.tog{display:flex;align-items:center;gap:7px;border:1px solid var(--line);
    background:transparent;border-radius:7px;padding:5px 11px;font-size:13px;cursor:pointer;
    color:var(--ink);font-family:inherit;}
  button.tog .dot{width:14px;height:10px;border-radius:2px;background:var(--dc);}
  button.tog.off{color:#B8BCC1;}
  button.tog.off .dot{background:#D8DADD;}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .chartbox{position:relative;}
  #plot{width:100%;}
  svg{display:block;touch-action:pan-y;}
  svg text{font-family:inherit;font-variant-numeric:tabular-nums;}
  .ctip{position:absolute;pointer-events:none;background:rgba(34,38,43,.94);color:#F2F1EE;
    border-radius:8px;padding:9px 12px;font-size:12.5px;line-height:1.55;display:none;
    min-width:200px;z-index:5;font-variant-numeric:tabular-nums;}
  .ctip .t{color:#B9BEC4;margin-bottom:3px;}
  .ctip .r{display:flex;justify-content:space-between;gap:14px;}
  .ctip .r i{font-style:normal;display:flex;align-items:center;gap:6px;}
  .ctip .r i::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--dc);}
  .ctip .evs{margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.22);}
  .ctip .ev{display:flex;align-items:baseline;gap:6px;}
  .ctip .ev i{flex:none;width:8px;height:8px;border-radius:50%;background:#DC2626;}
  .ctip .evd{color:#D5D8DC;margin-top:3px;white-space:normal;}
  .ctip.wide{width:340px;}
  @media (max-width:600px){ .ctip.wide{width:min(300px, calc(100vw - 64px));} }
  .notes{font-size:12px;color:var(--muted);line-height:1.7;}
  /* 暴跌一覽表（樣式沿用股債信用疊圖 table.tl） */
  .tl-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:10px;}
  .tl-head h2{font-size:17px;font-weight:500;margin:0;letter-spacing:.3px;}
  .tl-head span{color:var(--muted);font-size:12.5px;}
  table.tl{width:100%;border-collapse:collapse;font-size:13.5px;line-height:1.6;}
  table.tl th{font-size:12px;font-weight:400;color:var(--muted);letter-spacing:1px;text-align:left;
    padding:6px 10px;border-bottom:1px solid var(--ink);white-space:nowrap;}
  table.tl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  table.tl tbody tr:hover{background:#FAF9F6;}
  table.tl tr.deep{background:var(--band);}
  table.tl tbody tr.deep:hover{background:rgba(217,79,61,0.15);}
  .tl .no{color:var(--muted);text-align:right;width:28px;font-variant-numeric:tabular-nums;}
  .tl .d{white-space:nowrap;font-variant-numeric:tabular-nums;}
  .tl .x{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:#DC2626;}
  table.tl th.x{text-align:right;color:var(--muted);font-weight:400;}
  .tl-notes{margin-top:10px;}
  @media (max-width:600px){
    table.tl{font-size:12.5px;}
    table.tl th, table.tl td{padding:7px 5px;}
    .tl .d{white-space:normal;}
  }
  .notes p{margin:2px 0;}
</style>
</head>
<body>
<script src="nav.js?v=20261120a"></script>
<div class="wrap">
  <header>
    <div>
      <h1>Put/Call 比率</h1>
      <p class="sub" id="sub">Cboe 美股選擇權 Put/Call（5 日平均）× 費城半導體 SOX，2017 年起；淡紅底為 SOX 暴跌期間</p>
    </div>
  </header>

  <section class="card controls">
    <div class="grp"><span class="lbl">區間</span>
      <button class="rng" data-r="252">1Y</button><button class="rng" data-r="504">2Y</button>
      <button class="rng" data-r="1260">5Y</button><button class="rng on" data-r="all">ALL</button>
    </div>
    <div class="grp" id="kind"><span class="lbl">Put/Call</span>
      <button class="rng on" data-k="0">總</button><button class="rng" data-k="1">個股</button><button class="rng" data-k="2">指數</button><button class="rng" data-k="3">SMH</button>
    </div>
    <div class="grp"><span class="lbl">參考線</span>
      <button class="tog" id="refLo" style="--dc:var(--lo5)"><span class="dot" style="height:3px"></span>最低 5%＝警惕樂觀過頭</button>
      <button class="tog" id="refHi" style="--dc:var(--hi5)"><span class="dot" style="height:3px"></span>最高 5%＝恐慌中</button>
    </div>
    <div class="grp"><span class="lbl">底色區間</span>
      <button class="tog" id="bandTog" style="--dc:#F0C9C2"><span class="dot"></span>SOX 暴跌（高點→低點）</button>
    </div>
  </section>

  <section class="card chartbox">
    <div id="plot"></div>
    <div id="tip" class="ctip"></div>
  </section>

  <section class="card">
    <div class="tl-head"><h2>SOX 暴跌一覽</h2><span id="tlSub"></span></div>
    <table class="tl"><thead><tr><th class="no">#</th><th>高點 → 低點</th><th class="x">跌幅</th><th>原因</th></tr></thead><tbody id="tlBody"></tbody></table>
    <div class="notes tl-notes"><p>[註]：淡紅底＝跌幅超過 30%；跌幅以 SOX 收盤價計算，原因與圖上紅點浮標相同。</p></div>
  </section>

  <section class="card notes" id="notes"></section>
</div>

<script>
const $ = id => document.getElementById(id);
const fmt = (v, d = 2) => v == null ? "—" : Number(v).toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
const ymd = s => s.replace(/-/g, "/");
const KIND = ["總", "個股", "指數", "SMH"];   // SMH＝OCC 依標的成交量（2026-11-23 加，2024-11 起）
let J, range = "all", kind = 0, band = true, pin = null, showLo = true, showHi = true;
// 參考線（2026-11-20 使用者要求）：每天取「前 252 個交易日 5 日均」的第 5／95 百分位，線會隨市場移動。
// 回測（宏觀因果驗證\putcall\crash\levels.py）：總 P/C 落在最低 5% 時，SOX 之後 60 日內再跌 ≥20% 的機率約為平常兩倍。
const LB = 252;
function rollPct(ma, q) {
  return ma.map((_, i) => {
    if (i < LB + 4) return null;
    const w = ma.slice(i - LB, i).filter(x => x != null).sort((a, b) => a - b);
    return w.length < LB ? null : w[Math.floor(q / 100 * (w.length - 1))];
  });
}
// 各次 SOX 暴跌原因（2026-11-20 使用者要求）：鍵＝低點日（data/putcall.json ev[1]），紅點畫在該日 SOX 收盤，說明只在點擊浮標內顯示。
// 原因為媒體事後歸因；2026 年三波標題沿用使用者既有命名（大盤監控 PC_EVENTS、股債信用疊圖 SOX_LOWS、導火線時間軸）。新事件出現時在此補一筆。
const CAUSE = {
  "2018-12-24": ["貿易戰＋升息縮表＋記憶體循環反轉", "3 月美國對中啟動 301 關稅，全年層層加碼；Fed 全年升息 4 碼並縮表，12/19 再升息；記憶體報價下半年轉跌，半導體進入庫存修正。"],
  "2019-05-31": ["美中關稅升級＋華為禁令", "5/5 川普宣布 2,000 億美元中國商品關稅由 10% 升至 25%（5/10 生效）；5/15 華為列入實體清單，美系晶片廠斷供。"],
  "2020-03-18": ["新冠疫情", "疫情擴散到歐美、各國封城；3/16 SOX 單日 −15.9%，為 1994 年以來最大單日跌幅。"],
  "2022-10-14": ["Fed 升息空頭（2022）", "Fed 3 月起連續大幅升息，6 月 CPI 年增 9.1%；2 月俄烏戰爭推高油價；10/7 美國對中晶片出口管制。"],
  "2023-10-30": ["美債殖利率飆升", "Fed「更高更久」，10 年債 10/19 逼近 5%；8/1 惠譽調降美國評等；10/7 以哈戰爭；10/17 美國擴大對中 AI 晶片管制。"],
  "2024-04-19": ["降息延後＋設備股財報＋中東衝突", "3 月 CPI 高於預期，降息預期延後；ASML 4/17 訂單不如預期、台積電 4/18 下修產業成長預估；4/13 伊朗攻擊以色列、4/19 以色列反擊。"],
  "2024-08-07": ["資金輪動＋管制疑慮＋日圓套利平倉", "7/11 CPI 降溫，資金由科技股轉向小型股；7/17 傳美國考慮更嚴對中晶片管制、川普稱台灣應付保護費；7/31 日銀升息、8/2 非農疲弱，8/5 日圓套利交易平倉、全球股市重挫。"],
  "2025-04-08": ["DeepSeek＋川普關稅", "1/27 DeepSeek 低成本模型引發 AI 資本支出疑慮，輝達單日 −17%；4/2「解放日」對等關稅，全球股市連日重挫，4/9 宣布暫緩 90 天後反彈。"],
  "2026-03-30": ["美伊戰爭", "美伊戰爭期間的下跌（2/26–3/31）；細部導火線尚未整理。"],
  "2026-07-29": ["去槓桿", "融資部位去槓桿（FINRA 融資餘額 7 月下降），詳見融資槓桿頁；細部導火線尚未整理。"],
  "2026-11-05": ["AI 融資疑慮（CDS）＋民主黨勝選", "10/8 FT 報導 OpenAI 年化營收約 500 億美元、低於傳聞；10 年債逼近 5.35%、Fed 預期再升息；CoreWeave 債券殖利率近 15%；10/30 英特爾財測不佳 −29%；11/5 民主黨贏得期中選舉後市場憂監管拖慢資料中心建設，SOX 單日 −12.25%。詳見股債信用疊圖「SOX 導火線時間軸」。"],
};

function draw() {
  if (!J) return;
  const el = $("plot"), allD = J.idx.d, allS = J.idx.v;
  const raw = allD.map(d => kind === 3 ? (J.smh && J.smh[d] != null ? J.smh[d] : null) : J.pc[d] ? J.pc[d][kind] : null);
  const ma = raw.map((_, i) => { if (i < 4) return null; const w = raw.slice(i - 4, i + 1); return w.some(x => x == null) ? null : w.reduce((a, b) => a + b, 0) / 5; });
  let i0 = allD.findIndex(d => d >= J.start);
  if (range !== "all") i0 = Math.max(i0, allD.length - +range);
  if (kind === 3) i0 = Math.max(i0, raw.findIndex(x => x != null));   // SMH 只有 2024-11 起，前面空白不畫
  const lo5all = rollPct(ma, 5), hi5all = rollPct(ma, 95);
  const D = allD.slice(i0), M = ma.slice(i0), R = raw.slice(i0), S = allS.slice(i0), n = D.length - 1;
  const LO = lo5all.slice(i0), HI = hi5all.slice(i0);
  const W = Math.max(el.clientWidth, 280), narrow = W < 560;
  const L = 4, Rm = 50, T = 8, H1 = narrow ? 230 : 330, gap = 18, H2 = narrow ? 120 : 170, B = 22, H = T + H1 + gap + H2 + B;
  const X = i => L + (W - L - Rm) * i / n;
  const ext = a => { const v = a.filter(x => x != null); const lo = Math.min(...v), hi = Math.max(...v), p = (hi - lo) * .06; return [lo - p, hi + p]; };
  const [a1, b1] = ext([...M, ...(showLo ? LO : []), ...(showHi ? HI : [])]), [a2, b2] = ext(S.map(v => v == null ? null : Math.log(v)));   // SOX 用對數刻度，早年跌幅才看得出來
  const Y1 = v => T + H1 * (1 - (v - a1) / (b1 - a1)), Y2 = v => T + H1 + gap + H2 * (1 - (Math.log(v) - a2) / (b2 - a2));
  const pos = {}; D.forEach((d, i) => pos[d] = i);
  const at = d => pos[d] ?? D.findIndex(x => x >= d);
  let g = "";
  if (band) J.ev.forEach(e => {
    if (e[1] < D[0]) return;
    const a = e[0] < D[0] ? 0 : at(e[0]), b = at(e[1]) < 0 ? n : at(e[1]);
    const x1 = X(a), w = Math.max(X(b) - x1, 3), c = e[3] ? "var(--band-cur)" : "var(--band)";
    g += `<rect x="${x1.toFixed(1)}" y="${T}" width="${w.toFixed(1)}" height="${H1}" fill="${c}"/><rect x="${x1.toFixed(1)}" y="${T + H1 + gap}" width="${w.toFixed(1)}" height="${H2}" fill="${c}"/>`;
  });
  const step = (a, b, k) => { const s = Math.pow(10, Math.floor(Math.log10((b - a) / k))); return [1, 2, 2.5, 5, 10].find(x => (b - a) / (s * x) <= k) * s; };
  const st1 = step(a1, b1, 5);
  for (let v = Math.ceil(a1 / st1) * st1; v <= b1; v += st1)
    g += `<line x1="${L}" x2="${W - Rm}" y1="${Y1(v)}" y2="${Y1(v)}" stroke="#ECEAE5"/><text x="${W - Rm + 6}" y="${Y1(v) + 4}" font-size="11" fill="#6B7178">${v.toFixed(2)}</text>`;
  const sT = (b2 - a2 > 1.2 ? [500, 1000, 2000, 4000, 8000, 16000] : b2 - a2 > 0.6 ? [500, 1000, 1500, 2000, 3000, 4000, 6000, 8000, 12000, 16000] : [1000, 1500, 2000, 2500, 3000, 3500, 4000, 5000, 6000, 7000, 8000, 9000, 10000, 12000, 14000]).filter(v => Math.log(v) >= a2 && Math.log(v) <= b2);
  (narrow ? sT.filter((_, i) => i % 2 === 0) : sT).forEach(v =>
    g += `<line x1="${L}" x2="${W - Rm}" y1="${Y2(v)}" y2="${Y2(v)}" stroke="#ECEAE5"/><text x="${W - Rm + 6}" y="${Y2(v) + 4}" font-size="11" fill="#6B7178">${v.toLocaleString("en-US")}</text>`);
  // X 軸：區間短標月份，長標年份
  const monthly = n < 600;
  let last = "", lastX = -99;
  D.forEach((d, i) => {
    const k = monthly ? d.slice(0, 7) : d.slice(0, 4);
    if (k === last) return; last = k;
    if (i === 0 && (monthly ? d.slice(-2) > "05" : d.slice(5) > "01-10")) return;   // 起點不是月初／年初就不標
    if (X(i) - lastX < (monthly ? 52 : 40)) return; lastX = X(i);
    const lab = monthly ? (d.slice(5, 7) === "01" ? d.slice(0, 4) : +d.slice(5, 7) + "月") : d.slice(0, 4);
    g += `<line x1="${X(i)}" x2="${X(i)}" y1="${H - B}" y2="${H - B + 4}" stroke="#B9BDC2"/><text x="${X(i) + 3}" y="${H - 6}" font-size="11" fill="#6B7178">${lab}</text>`;
  });
  g += `<line x1="${L}" x2="${W - Rm}" y1="${H - B}" y2="${H - B}" stroke="#B9BDC2"/>`;
  const path = (arr, Y) => { let p = "", up = false; arr.forEach((v, i) => { if (v == null) { up = false; return; } p += (up ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1); up = true; }); return p; };
  if (showLo) g += `<path d="${path(LO, Y1)}" fill="none" stroke="var(--lo5)" stroke-width="1.6" stroke-linejoin="round" opacity=".9"/>`;
  if (showHi) g += `<path d="${path(HI, Y1)}" fill="none" stroke="var(--hi5)" stroke-width="1.6" stroke-linejoin="round" opacity=".9"/>`;
  g += `<path d="${path(M, Y1)}" fill="none" stroke="var(--pc)" stroke-width="${n > 800 ? 1.2 : 1.6}" stroke-linejoin="round"/>`;
  g += `<path d="${path(S, Y2)}" fill="none" stroke="var(--idx)" stroke-width="1.4" stroke-linejoin="round"/>`;
  J.ev.forEach(e => { const k = pos[e[1]]; if (k == null || S[k] == null) return;
    g += `<circle cx="${X(k).toFixed(1)}" cy="${Y2(S[k]).toFixed(1)}" r="4.5" fill="#DC2626" stroke="#fff" stroke-width="1.5"/>`; });
  g += `<text x="${L + 6}" y="${T + 15}" font-size="12.5" font-weight="500" fill="#22262B">${KIND[kind]} Put/Call（5 日平均）</text>`;
  g += `<text x="${L + 6}" y="${T + H1 + gap + 15}" font-size="12.5" font-weight="500" fill="#22262B">費城半導體 SOX（對數刻度）</text>`;
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Put/Call 與費城半導體 SOX 長期走勢">${g}
    <line class="ch" y1="${T}" y2="${H - B}" stroke="#8C9096" stroke-width="1" style="display:none"/>
    <circle class="d1" r="3.5" fill="var(--pc)" stroke="#fff" stroke-width="1.5" style="display:none"/>
    <circle class="d2" r="3.5" fill="var(--idx)" stroke="#fff" stroke-width="1.5" style="display:none"/>
    <rect class="hit" x="0" y="0" width="${W}" height="${H}" fill="transparent"/></svg>`;
  const svg = el.firstChild, ch = svg.querySelector(".ch"), d1 = svg.querySelector(".d1"), d2 = svg.querySelector(".d2"), tip = $("tip");
  const idxAt = e => { const r = svg.getBoundingClientRect(); return Math.max(0, Math.min(n, Math.round((e.clientX - r.left - L) / (W - L - Rm) * n))); };
  const mark = i => {
    ch.setAttribute("x1", X(i)); ch.setAttribute("x2", X(i)); ch.style.display = "";
    d1.style.display = M[i] == null ? "none" : ""; if (M[i] != null) { d1.setAttribute("cx", X(i)); d1.setAttribute("cy", Y1(M[i])); }
    d2.style.display = S[i] == null ? "none" : ""; if (S[i] != null) { d2.setAttribute("cx", X(i)); d2.setAttribute("cy", Y2(S[i])); }
  };
  const clear = () => { ch.style.display = d1.style.display = d2.style.display = "none"; };
  // 與股債信用疊圖一致：游標只有十字線，點擊才開浮標
  svg.addEventListener("pointermove", e => { if (pin == null) mark(idxAt(e)); });
  svg.addEventListener("pointerleave", () => { if (pin == null) clear(); });
  svg.addEventListener("click", e => {
    let i = idxAt(e);
    const lowNear = J.ev.map(x => pos[x[1]]).find(k => k != null && Math.abs(X(k) - X(i)) <= 6);
    if (lowNear != null) i = lowNear;
    if (pin === i) { pin = null; tip.style.display = "none"; return; }
    pin = i; mark(i);
    const ev = J.ev.find(x => D[i] >= x[0] && D[i] <= x[1]);
    tip.innerHTML = `<div class="t">${ymd(D[i])}</div>
      <div class="r" style="--dc:var(--pc)"><i>${KIND[kind]} P/C 5 日均</i><b>${fmt(M[i])}</b></div>
      <div class="r" style="--dc:#9DB8F0"><i>當日</i><span>${fmt(R[i])}</span></div>
      ${HI[i] != null ? `<div class="r" style="--dc:var(--hi5)"><i>最高 5% 線</i><span>${fmt(HI[i])}</span></div>
      <div class="r" style="--dc:var(--lo5)"><i>最低 5% 線</i><span>${fmt(LO[i])}</span></div>
      <div class="r"><span>${M[i] >= HI[i] ? "<b style='color:#F4A3A3'>恐慌中</b>" : M[i] <= LO[i] ? "<b style='color:#F5C27A'>警惕樂觀過頭</b>" : "介於兩線之間"}</span></div>` : ""}
      <div class="r" style="--dc:var(--idx)"><i>SOX</i><b>${fmt(S[i], 0)}</b></div>`
      + (ev ? (() => { const c = CAUSE[ev[1]];
        return `<div class="evs"><div class="ev"><i></i><span><b>${c ? c[0] : "原因待補"}</b>${D[i] === ev[1] ? "（SOX 低點）" : ""}</span></div>
          <div class="evd">SOX ${ymd(ev[0])} 高點 → ${ymd(ev[1])} 低點，${(ev[2] * 100).toFixed(1)}%${ev[3] ? "（進行中）" : ""}</div>
          ${c ? `<div class="evd">${c[1]}</div>` : ""}</div>`; })() : "");
    tip.classList.toggle("wide", !!ev);
    tip.style.display = "block";
    const box = el.parentElement.getBoundingClientRect(), r = svg.getBoundingClientRect();
    const x = r.left - box.left + X(i), tw = tip.offsetWidth;
    tip.style.left = Math.max(8, x + 14 + tw > box.width - 8 ? x - tw - 14 : x + 14) + "px";
    tip.style.top = Math.max(8, Math.min(e.clientY - box.top - 20, box.height - tip.offsetHeight - 8)) + "px";
  });
}

document.querySelectorAll("button[data-r]").forEach(b => b.addEventListener("click", () => {
  range = b.dataset.r; pin = null; $("tip").style.display = "none";
  document.querySelectorAll("button[data-r]").forEach(x => x.classList.toggle("on", x === b)); draw();
}));
document.querySelectorAll("button[data-k]").forEach(b => b.addEventListener("click", () => {
  kind = +b.dataset.k; pin = null; $("tip").style.display = "none";
  document.querySelectorAll("button[data-k]").forEach(x => x.classList.toggle("on", x === b)); draw();
}));
$("bandTog").addEventListener("click", () => { band = !band; $("bandTog").classList.toggle("off", !band); draw(); });
$("refLo").addEventListener("click", () => { showLo = !showLo; $("refLo").classList.toggle("off", !showLo); draw(); });
$("refHi").addEventListener("click", () => { showHi = !showHi; $("refHi").classList.toggle("off", !showHi); draw(); });
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(draw, 150); });

fetch("data/putcall.json", {cache: "no-store"}).then(r => r.json()).then(j => {
  J = j;
  const lastPc = Object.keys(j.pc).pop(), cur = j.ev.find(e => e[3]);
  $("sub").textContent = `Cboe 美股選擇權 Put/Call（5 日平均）× 費城半導體 SOX，2017 年起；資料至 ${ymd(lastPc)}，更新 ${j.updated}（台灣時間）`;
  $("notes").innerHTML = `<p>[註1]：Put/Call＝賣權成交量 ÷ 買權成交量，越高代表買保護的人越多、市場越恐慌；總＝全部選擇權，個股＝散戶情緒為主，指數＝法人避險為主。</p>
    <p>[註2]：淡紅底＝費城半導體 SOX 從高點跌 15% 以上、到低點為止的期間（2017 年起共 ${j.ev.length} 次；跌與反彈都超過 15% 才算一段）${cur ? "，最右側較深色為目前這波，低點暫定為目前最低" : ""}。</p>
    <p>[註3]：紅點＝每次暴跌的 SOX 最低收盤；點紅點或紅底內任一處，浮標會顯示這次暴跌的原因，再點一次關閉。</p>
    <p>[註4]：暴跌原因為媒體事後歸因，同一波通常是多個因素疊加，僅列主要事件。</p>
    <p>[註5]：參考線＝每天與自己過去一年（252 個交易日）的 5 日均比較，橘線為最低 5%、紅線為最高 5%，會隨市場移動。2017 年起回測：總 P/C 跌破橘線時，SOX 之後 60 日內再跌 20% 以上的機率約 23%，是平常（11%）的兩倍；高於紅線時多半已在暴跌中，但不代表當天就是低點。</p>
    <p>[註6]：SMH＝VanEck 半導體 ETF 選擇權的 Put/Call，資料來自 OCC（全美各交易所結算量加總），只能回溯到 2024/11，之後每天累積；參考線要滿一年資料才會出現（約 2025/12 起）。ETF 選擇權以法人避險為主，數值本來就比總 P/C 高（中位數約 2.2），單日波動也大，請看 5 日平均與自身參考線，勿與其他三條直接比大小。選 SMH 時圖表從 2024/11 開始，5Y、ALL 與 2Y 範圍相同。</p>`;
  // 暴跌一覽表：由 ev 自動列出，原因取 CAUSE；跌幅超過 30% 上淡紅底（2026-11-20 使用者要求）
  const md = (a, b) => a.slice(0, 4) === b.slice(0, 4) ? b.slice(5).replace("-", "/").replace(/^0/, "").replace("/0", "/") : ymd(b);
  $("tlBody").innerHTML = j.ev.map((e, k) => { const c = CAUSE[e[1]];
    return `<tr${e[2] <= -0.30 ? ' class="deep"' : ""}><td class="no">${k + 1}</td>
      <td class="d">${ymd(e[0])} → ${md(e[0], e[1])}${e[3] ? "（進行中）" : ""}</td>
      <td class="x">${(e[2] * 100).toFixed(1)}%</td><td>${c ? c[0] : "原因待補"}</td></tr>`; }).join("");
  $("tlSub").textContent = `2017 年起共 ${j.ev.length} 次，跌幅超過 30% 有 ${j.ev.filter(e => e[2] <= -0.30).length} 次`;
  draw();
}).catch(e => { $("sub").textContent = "資料讀取失敗：" + e; });
</script>
</body>
