<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>股債信用疊圖｜宏觀監控儀表板</title>
<style>
  /* 版面與互動沿用融資槓桿頁第一張圖（pipeline/margin/template.html） */
  :root{
    --bg:#F6F5F2; --card:#FFFFFF; --ink:#22262B; --muted:#6B7178;
    --line:#E4E2DC; --accent:#B04A2F;
    --spx:#2563EB; --ndx:#7C3AED; --sox:#DC2626;
    --dgs10:#D97706; --ig:#1D7A46; --hy:#22262B;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;
    margin:0;padding:0 16px 40px;}
  .wrap{max-width:1180px;margin:20px auto 0;display:flex;flex-direction:column;gap:14px;}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;padding:4px 4px 0;}
  h1{font-size:28px;margin:0;letter-spacing:.5px;}
  .sub{color:var(--muted);font-size:13px;margin:0;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
  .controls{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;}
  .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .grp .lbl{font-size:12px;color:var(--muted);letter-spacing:1px;margin-right:2px;}
  button.rng{border:1px solid var(--line);background:transparent;color:var(--muted);
    border-radius:7px;padding:5px 11px;font-size:13px;cursor:pointer;font-family:inherit;}
  button.rng:hover{border-color:#C9C6BF;}
  button.rng.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  button.tog{display:flex;align-items:center;gap:7px;border:1px solid var(--line);
    background:transparent;border-radius:7px;padding:5px 11px;font-size:13px;cursor:pointer;
    color:var(--ink);font-family:inherit;}
  button.tog .dot{width:14px;height:4px;border-radius:2px;background:var(--dc);}
  button.tog.off{color:#B8BCC1;}
  button.tog.off .dot{background:#D8DADD;}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .chartbox{position:relative;}
  canvas{display:block;width:100%;height:600px;}
  @media (max-width:600px){ canvas{height:480px;} }
  #tip{position:absolute;pointer-events:none;background:rgba(34,38,43,.94);color:#F2F1EE;
    border-radius:8px;padding:9px 12px;font-size:12.5px;line-height:1.55;display:none;
    min-width:190px;z-index:5;font-variant-numeric:tabular-nums;}
  #tip .t{color:#B9BEC4;margin-bottom:3px;}
  #tip .r{display:flex;justify-content:space-between;gap:14px;}
  #tip .r i{font-style:normal;display:flex;align-items:center;gap:6px;}
  #tip .r i::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--dc);}
</style>
</head>
<body>
<script src="nav.js?v=20261103b"></script>
<div class="wrap">
  <header>
    <div>
      <h1>股債信用疊圖</h1>
      <p class="sub" id="sub">S&amp;P 500 / Nasdaq-100 / 費城半導體 × 10 年期公債殖利率 × 投資級、垃圾級信用利差</p>
    </div>
  </header>

  <section class="card controls">
    <div class="grp"><span class="lbl">區間</span>
      <button class="rng" data-r="63">3M</button><button class="rng" data-r="126">6M</button>
      <button class="rng" data-r="252">1Y</button><button class="rng" data-r="504">2Y</button>
      <button class="rng on" data-r="all">ALL</button>
    </div>
    <div class="grp"><span class="lbl">疊圖線</span>
      <button class="tog" data-s="spx" style="--dc:var(--spx)"><span class="dot"></span>S&amp;P 500</button>
      <button class="tog" data-s="ndx" style="--dc:var(--ndx)"><span class="dot"></span>Nasdaq-100</button>
      <button class="tog" data-s="sox" style="--dc:var(--sox)"><span class="dot"></span>SOX 半導體</button>
    </div>
    <div class="grp"><span class="lbl">下欄指標</span>
      <button class="tog" data-s="dgs10" style="--dc:var(--dgs10)"><span class="dot"></span>10 年期殖利率</button>
      <button class="tog" data-s="oas_ig" style="--dc:var(--ig)"><span class="dot"></span>投資級利差</button>
      <button class="tog" data-s="oas_hy" style="--dc:var(--hy)"><span class="dot"></span>垃圾級利差</button>
    </div>
  </section>

  <section class="card chartbox">
    <canvas id="cv"></canvas>
    <div id="tip"></div>
  </section>
</div>

<script>
const UP = [
  {k:"spx", name:"S&P 500",    color:"#2563EB"},
  {k:"ndx", name:"Nasdaq-100", color:"#7C3AED"},
  {k:"sox", name:"SOX",        color:"#DC2626"},
];
const LOW = [
  {k:"dgs10",  name:"10 年期殖利率", color:"#D97706", fmt:v=>v.toFixed(2)+"%"},
  {k:"oas_ig", name:"投資級利差",    color:"#1D7A46", fmt:v=>v.toFixed(0)+" bp"},
  {k:"oas_hy", name:"垃圾級利差",    color:"#22262B", fmt:v=>v.toFixed(0)+" bp"},
];
const state = {range:"all", show:{spx:true,ndx:true,sox:true,dgs10:true,oas_ig:true,oas_hy:true}};
const cv = document.getElementById("cv"), tip = document.getElementById("tip");
const ctx = cv.getContext("2d");
let RAW = {}, M = [], N = 0, LAY = null, hoverI = -1, tipOn = false;

function visRange(){
  if(state.range==="all") return [0, N-1];
  return [Math.max(0, N-1-(+state.range)), N-1];
}
function niceLogTicks(lo, hi){
  // 依範圍挑整數刻度：由疏到密，取第一組有 4 格以上的
  const SETS=[[1,2,5],[1,1.5,2,3,5,7],[1,1.2,1.5,2,2.5,3,4,5,6,8],[1,1.1,1.2,1.3,1.4,1.5,1.6,1.8,2,2.2,2.5,3,3.5,4,4.5,5,6,7,8,9]];
  const e0=Math.floor(Math.log10(lo)), e1=Math.ceil(Math.log10(hi));
  let out=[];
  for(const set of SETS){
    out=[];
    for(let e=e0;e<=e1;e++) for(const m of set){ const v=m*Math.pow(10,e); if(v>=lo&&v<=hi) out.push(Math.round(v*100)/100); }
    if(out.length>=4) break;
  }
  return out;
}
function niceLinTicks(lo, hi){
  const span=hi-lo, raw=span/5, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(x=>x*mag).find(s=>span/s<=6)||mag*10;
  const out=[]; for(let v=Math.ceil(lo/step)*step; v<=hi+1e-9; v+=step) out.push(v);
  return out;
}
function extent(arr, i0, i1){
  let lo=Infinity, hi=-Infinity;
  for(let i=i0;i<=i1;i++){ const v=arr[i]; if(v!=null){ lo=Math.min(lo,v); hi=Math.max(hi,v);} }
  return [lo,hi];
}
function drawLine(arr, i0, i1, X, Y, color, width){
  ctx.strokeStyle=color; ctx.lineWidth=width; ctx.beginPath(); let st=false;
  for(let i=i0;i<=i1;i++){ const v=arr[i]; if(v==null) continue;
    const x=X(i), y=Y(v); st?ctx.lineTo(x,y):(ctx.moveTo(x,y),st=true); }
  ctx.stroke();
}

function draw(){
  if(!N) return;
  const dpr = window.devicePixelRatio||1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const padL=62, padR=48, gap=30;
  const h1t=24, h1b=Math.round(H*0.56), h2t=h1b+gap, h2b=H-30;
  const [i0,i1] = visRange(); const nvis=i1-i0;
  const X = i => padL + (i-i0)/(nvis||1)*(W-padL-padR);

  // 上欄：區間起點＝100、對數座標（同融資頁）
  const reb={};
  for(const s of UP){
    const arr=RAW[s.k]; let bi=i0; while(bi<=i1 && arr[bi]==null) bi++;
    const base=arr[bi]; reb[s.k]=arr.map(v=> v==null||!base?null:v/base*100);
  }
  let lo=Infinity, hi=-Infinity;
  for(const s of UP){ if(!state.show[s.k]) continue;
    const [a,b]=extent(reb[s.k],i0,i1); lo=Math.min(lo,a); hi=Math.max(hi,b); }
  if(!isFinite(lo)){ lo=90; hi=110; }
  lo*=0.97; hi*=1.03;
  const Y1 = v => h1b - (Math.log10(v)-Math.log10(lo))/(Math.log10(hi)-Math.log10(lo))*(h1b-h1t);

  // 下欄：殖利率左軸（%）、信用利差右軸（bp，對數，投資級與垃圾級才看得出幅度）
  let [ylo,yhi]=state.show.dgs10?extent(RAW.dgs10,i0,i1):[Infinity,-Infinity];
  if(!isFinite(ylo)){ ylo=3; yhi=5; }
  const ypad=Math.max((yhi-ylo)*0.1,0.05); ylo-=ypad; yhi+=ypad;
  const Y2 = v => h2b - (v-ylo)/(yhi-ylo)*(h2b-h2t);
  let rlo=Infinity, rhi=-Infinity;
  for(const k of ["oas_ig","oas_hy"]){ if(!state.show[k]) continue;
    const [a,b]=extent(RAW[k],i0,i1); rlo=Math.min(rlo,a); rhi=Math.max(rhi,b); }
  if(!isFinite(rlo)){ rlo=50; rhi=500; }
  rlo*=0.92; rhi*=1.08;
  const Y3 = v => h2b - (Math.log10(v)-Math.log10(rlo))/(Math.log10(rhi)-Math.log10(rlo))*(h2b-h2t);
  const anyOas = state.show.oas_ig||state.show.oas_hy;

  // 格線與刻度
  ctx.font="11px 'Microsoft JhengHei',sans-serif"; ctx.lineWidth=1;
  for(const t of niceLogTicks(lo,hi)){
    const y=Y1(t); if(y<h1t||y>h1b) continue;
    ctx.strokeStyle="rgba(0,0,0,0.06)"; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.textAlign="right"; ctx.fillStyle="#8A9097"; ctx.fillText(t>=1000?(t/1000)+"k":Math.round(t), padL-8, y+3.5);
  }
  if(state.show.dgs10){
    for(const t of niceLinTicks(ylo,yhi)){
      const y=Y2(t);
      ctx.strokeStyle="rgba(0,0,0,0.06)"; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
      ctx.textAlign="right"; ctx.fillStyle="#B7791F"; ctx.fillText(parseFloat(t.toFixed(2))+"%", padL-8, y+3.5);
    }
  }
  if(anyOas){
    for(const t of niceLogTicks(rlo,rhi)){
      const y=Y3(t); if(y<h2t-1||y>h2b+1) continue;
      if(!state.show.dgs10){ ctx.strokeStyle="rgba(0,0,0,0.06)";
        ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke(); }
      ctx.textAlign="left"; ctx.fillStyle="#8A9097"; ctx.fillText(Math.round(t), W-padR+6, y+3.5);
    }
  }

  // X 軸：短區間逐月，長區間 1 月與 7 月
  ctx.textAlign="center"; ctx.fillStyle="#8A9097";
  const shortRange = nvis<=140;
  let lastX=-999;
  for(let i=Math.max(i0,1);i<=i1;i++){
    if(M[i].slice(0,7)===M[i-1].slice(0,7)) continue;
    const yy=M[i].slice(0,4), mm=+M[i].slice(5,7);
    if(!shortRange && mm!==1 && mm!==7) continue;
    const x=X(i); if(x-lastX<44) continue;
    ctx.fillText(yy+"/"+mm, x, H-10); lastX=x;
  }

  // 線
  for(const s of LOW){ if(state.show[s.k]) drawLine(RAW[s.k],i0,i1,X,s.k==="dgs10"?Y2:Y3,s.color,1.6); }
  for(const s of UP){ if(state.show[s.k]) drawLine(reb[s.k],i0,i1,X,Y1,s.color,1.5); }

  // 欄標題
  ctx.textAlign="left"; ctx.fillStyle="#6B7178"; ctx.font="11.5px 'Microsoft JhengHei',sans-serif";
  ctx.fillText("指數（區間起點 = 100，對數座標）", padL, h1t-8);
  const t2=[], narrow=W<600;
  if(state.show.dgs10) t2.push(narrow?"10Y %（左）":"10 年期殖利率 %（左軸）");
  if(anyOas) t2.push(narrow?"利差 bp（右）":"信用利差 bp（右軸，對數座標）");
  ctx.fillText(t2.join("　×　"), padL, h2t-8);

  // 十字線
  if(hoverI>=i0 && hoverI<=i1){
    const x=X(hoverI);
    ctx.strokeStyle="rgba(34,38,43,0.35)"; ctx.lineWidth=1; ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(x,h1t); ctx.lineTo(x,h2b); ctx.stroke(); ctx.setLineDash([]);
    for(const s of UP){ if(!state.show[s.k]) continue; const v=reb[s.k][hoverI];
      if(v!=null){ ctx.fillStyle=s.color; ctx.beginPath(); ctx.arc(x,Y1(v),3.2,0,7); ctx.fill(); } }
    for(const s of LOW){ if(!state.show[s.k]) continue; const v=RAW[s.k][hoverI];
      if(v!=null){ ctx.fillStyle=s.color; ctx.beginPath(); ctx.arc(x,(s.k==="dgs10"?Y2:Y3)(v),3.2,0,7); ctx.fill(); } }
  }
  LAY={padL,padR,W,i0,i1};
}

function idxFromEvent(ev){
  if(!LAY) return -1;
  const r=cv.getBoundingClientRect(), mx=ev.clientX-r.left;
  const {padL,W,padR,i0,i1}=LAY;
  if(mx<padL||mx>W-padR) return -1;
  return Math.round(i0+(mx-padL)/(W-padL-padR)*(i1-i0));
}
function renderTip(ev){
  const m=M[hoverI]; if(!m){ tip.style.display="none"; return; }
  let html=`<div class="t">${m.replaceAll("-","/")}</div>`;
  for(const s of UP){ if(!state.show[s.k]) continue; const v=RAW[s.k][hoverI];
    if(v!=null) html+=`<div class="r"><i style="--dc:${s.color}">${s.name}</i><b>${v.toLocaleString("en-US",{maximumFractionDigits:0})}</b></div>`; }
  for(const s of LOW){ if(!state.show[s.k]) continue; const v=RAW[s.k][hoverI];
    if(v!=null) html+=`<div class="r"><i style="--dc:${s.color}">${s.name}</i><b>${s.fmt(v)}</b></div>`; }
  tip.innerHTML=html; tip.style.display="block";
  const r=cv.getBoundingClientRect(), mx=ev.clientX-r.left, my=ev.clientY-r.top, bw=tip.offsetWidth;
  tip.style.left=Math.min(Math.max(mx-bw/2,8), cv.clientWidth-bw-8)+"px";
  tip.style.top=(my<200? my+26 : my-tip.offsetHeight-18)+"px";
}
// 游標移動只有十字線；點一下才開浮標，再點一下關閉（同融資頁）
cv.addEventListener("pointermove", ev=>{
  hoverI=idxFromEvent(ev); draw();
  if(tipOn && hoverI>=0) renderTip(ev); else tip.style.display="none";
});
cv.addEventListener("pointerleave", ()=>{ hoverI=-1; tip.style.display="none"; draw(); });
cv.addEventListener("click", ev=>{
  tipOn=!tipOn;
  hoverI=idxFromEvent(ev); draw();
  if(tipOn && hoverI>=0) renderTip(ev); else tip.style.display="none";
});
document.querySelectorAll("button.rng").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("button.rng").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); state.range=b.dataset.r; draw();
}));
document.querySelectorAll("button.tog").forEach(b=>b.addEventListener("click",()=>{
  const k=b.dataset.s; state.show[k]=!state.show[k]; b.classList.toggle("off",!state.show[k]); draw();
}));
window.addEventListener("resize", draw);

fetch("data/overlay.json",{cache:"no-store"}).then(r=>r.json()).then(j=>{
  const keys=[...UP,...LOW].map(s=>s.k);
  const dates=new Set(); keys.forEach(k=>j[k].forEach(p=>dates.add(p[0])));
  M=[...dates].sort(); N=M.length;
  const pos=new Map(M.map((d,i)=>[d,i]));
  keys.forEach(k=>{ const a=new Array(N).fill(null); j[k].forEach(p=>{a[pos.get(p[0])]=p[1];}); RAW[k]=a; });
  document.getElementById("sub").textContent+=` ｜ ${M[0].slice(0,7).replace("-","/")} – ${M[N-1].slice(0,7).replace("-","/")}`;
  draw();
});
</script>
</body>
</html>
